      /* ── Splash Mundial 2026 ── */
      html, body { margin: 0; padding: 0; background: #080c14; }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at 50% 60%, #0d1a2e 0%, #080c14 70%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.55s ease, transform 0.55s ease;
      }
      #splash.fade-out { opacity: 0; transform: scale(1.04); pointer-events: none; }

      /* Background stars */
      #splash::before {
        content: '';
        position: absolute; inset: 0;
        background-image:
          radial-gradient(circle at 18% 25%, rgba(255,255,255,.9) 0 1px, transparent 2px),
          radial-gradient(circle at 72% 15%, rgba(255,255,255,.7) 0 1px, transparent 2px),
          radial-gradient(circle at 40% 8%,  rgba(255,255,255,.8) 0 1px, transparent 2px),
          radial-gradient(circle at 85% 35%, rgba(255,255,255,.6) 0 1px, transparent 2px),
          radial-gradient(circle at 12% 70%, rgba(255,255,255,.5) 0 1px, transparent 2px),
          radial-gradient(circle at 60% 80%, rgba(255,255,255,.7) 0 1px, transparent 2px),
          radial-gradient(circle at 90% 75%, rgba(255,255,255,.6) 0 1px, transparent 2px),
          radial-gradient(circle at 30% 90%, rgba(255,255,255,.4) 0 1px, transparent 2px);
        pointer-events: none;
      }

      .sp-content {
        display: flex; flex-direction: column; align-items: center;
        animation: sp-rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.05s both;
      }
      @keyframes sp-rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Stars */
      .sp-stars { display: flex; gap: 16px; margin-bottom: 30px; }
      .sp-star {
        width: 50px; height: 50px; color: #FBBF24;
        filter: drop-shadow(0 0 10px rgba(251,191,36,.6));
        animation: star-glow 2.8s ease-in-out infinite;
      }
      .sp-star:nth-child(2) { animation-delay: 0.22s; }
      .sp-star:nth-child(3) { animation-delay: 0.44s; }
      @keyframes star-glow {
        0%,100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(251,191,36,.5)); }
        50%      { transform: scale(1.12); filter: drop-shadow(0 0 20px rgba(251,191,36,.9)); }
      }

      /* Flags */
      .sp-flags { display: flex; gap: 28px; align-items: center; }
      .sp-flag {
        border-radius: 3px; overflow: hidden;
        box-shadow: 0 12px 32px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
      }
      .sp-flag-l { animation: wave-l 3.2s ease-in-out infinite; }
      .sp-flag-r { animation: wave-r 3.2s ease-in-out 0.55s infinite; }
      @keyframes wave-l {
        0%,100% { transform: rotate(-4deg) skewX(0deg); }
        50%      { transform: rotate(-4.8deg) skewX(2.8deg); }
      }
      @keyframes wave-r {
        0%,100% { transform: rotate(4deg) skewX(0deg); }
        50%      { transform: rotate(4.8deg) skewX(-2.8deg); }
      }

      /* Text */
