      /* ══════════════════════════════════════════════
         SPLASH MUNDIAL 2026 – ARGENTINA CAMPEÓN ★★★

      html, body { margin: 0; padding: 0; background: #080c14; }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at 50% 45%, #0d1e35 0%, #060a12 65%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        transition: opacity 0.65s ease, transform 0.65s ease;
      }
      #splash.fade-out { opacity: 0; transform: scale(1.06); pointer-events: none; }

      /* Subtle breathing glow */
      #splash::before {
        content: '';
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(ellipse at 25% 65%, rgba(116,172,223,.08) 0%, transparent 45%),
          radial-gradient(ellipse at 75% 35%, rgba(116,172,223,.08) 0%, transparent 45%);
        animation: bg-breathe 5s ease-in-out infinite alternate;
      }
      @keyframes bg-breathe {
        from { opacity: .4; transform: scale(1); }
        to   { opacity: 1;  transform: scale(1.05); }
      }

      /* Star field */
      #splash::after {
        content: '';
        position: absolute; inset: 0; pointer-events: none;
        background-image:
          radial-gradient(circle at  7% 10%, rgba(255,255,255,.9) 0 1.5px, transparent 2px),
          radial-gradient(circle at 20% 22%, rgba(255,255,255,.6) 0 1px,   transparent 1.5px),
          radial-gradient(circle at 38%  6%, rgba(255,255,255,.8) 0 1.5px, transparent 2px),
          radial-gradient(circle at 57% 14%, rgba(255,255,255,.5) 0 1px,   transparent 1.5px),
          radial-gradient(circle at 74%  8%, rgba(255,255,255,.9) 0 1.5px, transparent 2px),
          radial-gradient(circle at 88% 18%, rgba(255,255,255,.7) 0 1px,   transparent 1.5px),
          radial-gradient(circle at 93% 40%, rgba(255,255,255,.6) 0 1.5px, transparent 2px),
          radial-gradient(circle at 10% 55%, rgba(255,255,255,.5) 0 1px,   transparent 1.5px),
          radial-gradient(circle at 28% 78%, rgba(255,255,255,.7) 0 1px,   transparent 1.5px),
          radial-gradient(circle at 50% 85%, rgba(255,255,255,.6) 0 1.5px, transparent 2px),
          radial-gradient(circle at 70% 80%, rgba(255,255,255,.5) 0 1px,   transparent 1.5px),
          radial-gradient(circle at 85% 70%, rgba(255,255,255,.8) 0 1.5px, transparent 2px),
          radial-gradient(circle at  3% 88%, rgba(255,255,255,.6) 0 1px,   transparent 1.5px),
          radial-gradient(circle at 45% 50%, rgba(255,255,255,.4) 0 1px,   transparent 1.5px);
        animation: stars-twinkle 7s ease-in-out infinite;
      }
      @keyframes stars-twinkle {
        0%,100% { opacity: .6; }
        33%      { opacity: 1; }
        66%      { opacity: .75; }
      }

      /* ── Confetti ── */
      .cf {
        position: absolute;
        top: -18px;
        width: 8px; height: 13px;
        border-radius: 2px;
        opacity: 0;
      }
      @keyframes cf-a { 0%{opacity:0;top:-18px;transform:rotate(0deg)   translateX(0)}    6%{opacity:1} 100%{opacity:0;top:108%;transform:rotate(560deg)  translateX(45px)}  }
      @keyframes cf-b { 0%{opacity:0;top:-18px;transform:rotate(20deg)  translateX(0)}    6%{opacity:1} 100%{opacity:0;top:108%;transform:rotate(-420deg) translateX(-38px)} }
      @keyframes cf-c { 0%{opacity:0;top:-18px;transform:rotate(-15deg) translateX(0)}    6%{opacity:1} 100%{opacity:0;top:108%;transform:rotate(640deg)  translateX(28px)}  }
      @keyframes cf-d { 0%{opacity:0;top:-18px;transform:rotate(10deg)  translateX(0)}    6%{opacity:1} 100%{opacity:0;top:108%;transform:rotate(-500deg) translateX(-55px)} }
      @keyframes cf-e { 0%{opacity:0;top:-18px;transform:rotate(-5deg)  translateX(0)}    6%{opacity:1} 100%{opacity:0;top:108%;transform:rotate(380deg)  translateX(62px)}  }

      .cf:nth-child(1)  { left: 3%;  background:#74ACDF; animation:cf-a 2.8s 0.40s forwards; }
      .cf:nth-child(2)  { left: 8%;  background:#FFFFFF; animation:cf-b 3.1s 0.70s forwards; }
      .cf:nth-child(3)  { left:13%;  background:#F6B40E; animation:cf-c 2.5s 0.20s forwards; }
      .cf:nth-child(4)  { left:17%;  background:#74ACDF; animation:cf-d 3.3s 1.00s forwards; }

      .cf:nth-child(9)  { left:43%;  background:#F6B40E; animation:cf-a 3.2s 0.60s forwards; }
      .cf:nth-child(10) { left:48%;  background:#74ACDF; animation:cf-d 2.8s 0.80s forwards; }

      .cf:nth-child(12) { left:58%;  background:#F6B40E; animation:cf-c 2.7s 1.20s forwards; }
      .cf:nth-child(13) { left:62%;  background:#74ACDF; animation:cf-b 3.0s 0.45s forwards; }
      .cf:nth-child(14) { left:67%;  background:#FFFFFF; animation:cf-a 2.9s 0.75s forwards; }
      .cf:nth-child(15) { left:72%;  background:#F6B40E; animation:cf-d 2.6s 0.35s forwards; }
      .cf:nth-child(16) { left:77%;  background:#74ACDF; animation:cf-e 3.1s 0.95s forwards; }

      @keyframes star-glow {
        0%,100% { filter: drop-shadow(0 0  8px rgba(251,191,36,.45)); transform: scale(1); }

      .sp-flags { display:flex; gap:36px; align-items:center; }

      .sp-flag-wrap-l {
        animation: flag-in-l 0.85s 0.6s cubic-bezier(0.34,1.2,0.64,1) both;
      }
      .sp-flag-wrap-r {
        animation: flag-in-r 0.85s 0.6s cubic-bezier(0.34,1.2,0.64,1) both;
      }
      @keyframes flag-in-l {
        0%   { opacity:0; transform: translateX(-320px) rotate(-25deg) scale(0.7); }
        100% { opacity:1; transform: translateX(0)      rotate(0deg)   scale(1);   }
      }
      @keyframes flag-in-r {
        0%   { opacity:0; transform: translateX(320px) rotate(25deg) scale(0.7); }
        100% { opacity:1; transform: translateX(0)     rotate(0deg)  scale(1);   }
      }

      .sp-flag {
        border-radius: 4px; overflow: hidden;
        box-shadow: 0 8px 24px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08),

      }
      .sp-flag-l { animation: wave-l 3.5s 1.5s  ease-in-out infinite; }
      .sp-flag-r { animation: wave-r 3.5s 2.05s ease-in-out infinite; }

      @keyframes wave-l {
        0%,100% { transform: rotate(-4deg)   skewX(0deg)   scaleY(1);    }
        25%      { transform: rotate(-5.2deg) skewX(3.5deg) scaleY(0.977); }
        75%      { transform: rotate(-3deg)   skewX(-1.2deg) scaleY(1.012); }
      }
      @keyframes wave-r {
        0%,100% { transform: rotate(4deg)   skewX(0deg)    scaleY(1);    }
        25%      { transform: rotate(5.2deg) skewX(-3.5deg) scaleY(0.977); }

      .sp-country {

      .sp-brand {
        margin-top: 22px;
        font-size: 9px; letter-spacing: .3em;
        color: rgba(255,255,255,.15); text-transform: uppercase;
        opacity: 0;
        animation: txt-up 0.5s 1.75s ease both;
      }

      @keyframes txt-bounce {
        0%   { opacity:0; transform: translateY(40px) scale(0.65); }
        100% { opacity:1; transform: translateY(0)    scale(1);    }
      }
      @keyframes txt-up {
        from { opacity:0; transform: translateY(14px); }
        to   { opacity:1; transform: translateY(0);    }
      }
      @keyframes vamos-pulse {
        0%,100% { color: rgba(246,180,14,.7);  text-shadow: none; }
        50%      { color: rgba(246,180,14,1);   text-shadow: 0 0 16px rgba(246,180,14,.55); }
      }
