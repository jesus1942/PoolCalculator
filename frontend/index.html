    <script>
      // Aplicar el tema guardado antes de la primera pintura.
      try {
        var savedTheme = localStorage.getItem('pool-theme');
        document.documentElement.dataset.theme = (savedTheme === 'slate' || savedTheme === 'paper') ? savedTheme : 'paper';
      } catch (error) {
        document.documentElement.dataset.theme = 'paper';
      }
    </script>
    <style>
      html { background: #e8e1d1; color: #2b2f36; }
      html[data-theme='slate'] { background: #22252b; color: #ece6d8; }
      body { margin: 0; min-height: 100vh; }
      noscript p { max-width: 36rem; margin: 4rem auto; padding: 1.5rem; font: 1rem/1.6 system-ui, sans-serif; }
