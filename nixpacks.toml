providers = []

[phases.setup]
nixPkgs = [
  "nodejs_22",
  "python311",
  "python311Packages.pip",
  "libjpeg",
  "zlib"
]

[phases.install]
cmds = [
  "pip3 install --no-cache-dir --break-system-packages --target /app/backend/.python-packages openpyxl Pillow",
  "npm config set fetch-retries 5",
  "npm config set fetch-retry-factor 2",
  "npm config set fetch-retry-mintimeout 20000",
  "npm config set fetch-retry-maxtimeout 120000",
  "npm --prefix frontend ci --include=dev --no-audit --no-fund",
  "npm --prefix backend ci --include=dev --no-audit --no-fund"
]

[phases.build]
cmds = [
  "npm --prefix backend run prisma:generate",
  "npm --prefix frontend run build",
  "npm --prefix backend run build"
]

[start]
cmd = "npm --prefix backend run start:deploy"
