[phases.setup]
nixPkgs = [
  "nodejs_20",
  "nodePackages.npm",
  "python311",
  "python311Packages.openpyxl",
  "python311Packages.pillow",
  "libjpeg",
  "zlib"
]

[phases.install]
cmds = [
  "npm --prefix frontend ci",
  "npm --prefix backend ci"
]

[phases.build]
cmds = [
  "npm --prefix frontend run build",
  "npm --prefix backend run build"
]

[start]
cmd = "npm --prefix backend run start:deploy"
providers = ["node"]
