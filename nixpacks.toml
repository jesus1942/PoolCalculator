providers = []

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python311",
  "python311Packages.pip",
  "libjpeg",
  "zlib"
]

[phases.install]
cmds = [
  "python3 -m pip install --no-cache-dir --break-system-packages --target /app/backend/.python-packages openpyxl Pillow",
  "npm --prefix frontend ci --include=dev",
  "npm --prefix backend ci --include=dev"
]

[phases.build]
cmds = [
  "npm --prefix frontend run build",
  "npm --prefix backend run build"
]

[start]
cmd = "npm --prefix backend run start:deploy"
