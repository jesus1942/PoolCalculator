providers = []

[variables]
PRISMA_HIDE_UPDATE_MESSAGE = "1"

[phases.setup]
nixPkgs = [
  "nodejs_22",
  "python311",
  "python311Packages.pip",
  "libjpeg",
  "zlib"
]

[phases.install]
cmds = [
  "pip3 install --no-cache-dir --break-system-packages --target /app/backend/.python-packages openpyxl Pillow",
  "npm config set fetch-retries 5",
  "npm config set fetch-retry-factor 2",
  "npm config set fetch-retry-mintimeout 20000",
  "npm config set fetch-retry-maxtimeout 120000",
  "npm ci --include=dev --no-audit --no-fund"
]

[phases.build]
cmds = ["npm run check"]

[start]
cmd = "npm --workspace backend run start:deploy"
