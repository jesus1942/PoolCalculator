name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: frontend-build
    runs-on: ubuntu-latest
    # Esta base se crea vacía para cada ejecución; no usa credenciales de producción.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poolinstaller_test
          POSTGRES_PASSWORD: poolinstaller_ci_test
          POSTGRES_DB: poolinstaller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poolinstaller_test -d poolinstaller_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://poolinstaller_test:poolinstaller_ci_test@localhost:5432/poolinstaller_test?schema=public
      VITE_API_URL: https://poolcalculator-production.up.railway.app/api
      VITE_BASE: /PoolCalculator/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --include=dev --no-fund

      - name: Generate Prisma client
        run: npm --workspace backend run prisma:generate

      - name: Apply all migrations to the empty test database
        run: npm exec --workspace backend -- prisma migrate deploy

      - name: Run backend and frontend regression tests
        run: npm test

      - name: Typecheck and build both applications
        run: npm run build
