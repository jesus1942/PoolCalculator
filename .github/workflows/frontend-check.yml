name: Frontend build check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci --ignore-scripts

      - name: Build frontend
        id: frontend_build
        continue-on-error: true
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: https://poolcalculator-production.up.railway.app/api
          VITE_BASE: /PoolCalculator/

      - name: Publish frontend status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.frontend_build.outcome }}';
            const state = outcome === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'frontend-build',
              description: state === 'success'
                ? 'Frontend compila correctamente'
                : 'Falló el build del frontend',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Fail workflow when frontend build fails
        if: steps.frontend_build.outcome != 'success'
        run: exit 1
