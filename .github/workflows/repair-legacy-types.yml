name: Repair legacy TypeScript debt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-legacy-types.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply narrow TypeScript repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path_str}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          export_path = 'frontend/src/components/EnhancedExportManager.tsx'
          replace_once(
              export_path,
              "  const [clientEditorSeedVersion, setClientEditorSeedVersion] = useState(0);\n",
              "  const [clientEditorSeedVersion, setClientEditorSeedVersion] = useState(0);\n  const [copiedPwaLink, setCopiedPwaLink] = useState(false);\n",
          )
          replace_once(
              export_path,
              "    const poolPreset = project.poolPreset || {};\n",
              "    const poolPreset = (project.poolPreset || {}) as any;\n",
          )
          replace_once(
              export_path,
              "    const overviewHydraulicSummary = hydraulicSummary;\n\n    return `\n",
              "    const overviewHydraulicSummary = hydraulicSummary;\n    const overviewConditions = getConditionsList(getTemplateSettings('client').conditions);\n    const visibleInstallationExclusions = getVisibleInstallationExclusions(overviewConditions);\n\n    return `\n",
          )

          tile_path = 'frontend/src/components/TileEditor.tsx'
          replace_once(
              tile_path,
              "  const handleSideChange = (side: keyof typeof config, field: keyof SideConfig, value: any) => {\n",
              "  const handleSideChange = (side: 'north' | 'south' | 'east' | 'west', field: keyof SideConfig, value: any) => {\n",
          )
          replace_once(
              tile_path,
              "  const getSideColor = (side: keyof typeof config) => {\n",
              "  const getSideColor = (side: 'north' | 'south' | 'east' | 'west') => {\n",
          )

          dashboard_path = 'frontend/src/pages/Dashboard.tsx'
          replace_once(
              dashboard_path,
              "              style={{\n                left: drop.left,\n                top: drop.top,\n                height: `${drop.height}px`,\n                ['--rain-duration' as '--rain-duration']: drop.duration,\n                ['--rain-delay' as '--rain-delay']: drop.delay,\n              }}\n",
              "              style={{\n                left: drop.left,\n                top: drop.top,\n                height: `${drop.height}px`,\n                '--rain-duration': drop.duration,\n                '--rain-delay': drop.delay,\n              } as React.CSSProperties}\n",
          )

      - name: Install dependencies
        run: npm --prefix frontend ci --ignore-scripts

      - name: Typecheck and build
        run: npm --prefix frontend run build:check
        env:
          VITE_API_URL: https://poolcalculator-production.up.railway.app/api
          VITE_BASE: /PoolCalculator/

      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/EnhancedExportManager.tsx frontend/src/components/TileEditor.tsx frontend/src/pages/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No repairs needed"
            exit 0
          fi
          git commit -m "fix(frontend): resolver deuda TypeScript heredada"
          git push origin HEAD:main
