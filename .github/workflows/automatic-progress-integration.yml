name: Automatic progress integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automatic-progress-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Integrate automatic progress signals
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path_str: str, old: str, new: str, label: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          timeline_path = 'frontend/src/components/ProjectTimeline.tsx'
          replace_once(
              timeline_path,
              "interface ProjectTimelineProps {\n  projectId: string;\n  projectName?: string;\n  clientName?: string;\n}",
              "interface ProjectTimelineProps {\n  projectId: string;\n  projectName?: string;\n  clientName?: string;\n  onTimelineChanged?: () => void;\n}",
              'timeline props',
          )
          replace_once(
              timeline_path,
              "export const ProjectTimeline: React.FC<ProjectTimelineProps> = ({ projectId, projectName = 'Proyecto', clientName }) => {",
              "export const ProjectTimeline: React.FC<ProjectTimelineProps> = ({ projectId, projectName = 'Proyecto', clientName, onTimelineChanged }) => {",
              'timeline signature',
          )
          replace_once(
              timeline_path,
              "      setTimelineItems(response.data.timeline || []);",
              "      setTimelineItems(response.data.timeline || []);\n      onTimelineChanged?.();",
              'timeline refresh callback',
          )

          tasks_path = Path('frontend/src/components/TasksManager.tsx')
          tasks = tasks_path.read_text(encoding='utf-8')
          tasks = tasks.replace('                          {getStatusBadge(task.status)}\n', '', 1)

          status_block = '''          <div>\n            <label className="block text-sm font-medium mb-1">Estado</label>\n            <select\n              value={formData.status}\n              onChange={(e) => setFormData({ ...formData, status: e.target.value as any })}\n              className="w-full px-3 py-2 border rounded-md"\n            >\n              <option value="pending">Pendiente</option>\n              <option value="in_progress">En Progreso</option>\n              <option value="completed">Completada</option>\n            </select>\n          </div>'''
          replacement = '''          <div className="rounded-lg border px-3 py-3 text-sm" style={{ borderColor: 'var(--hair)', backgroundColor: 'var(--card2)', color: 'var(--ink-soft)' }}>\n            El estado de avance de la obra se calcula automáticamente con hitos del Timeline, eventos de Agenda y la secuencia constructiva. No hace falta actualizar esta tarea manualmente.\n          </div>'''
          if status_block not in tasks:
              raise RuntimeError('manual task status block not found')
          tasks = tasks.replace(status_block, replacement, 1)

          pattern = re.compile(r"\n  const getStatusBadge = \(status: string\) => \{.*?\n  \};\n\n  const getTotalsByCategory", re.S)
          tasks, count = pattern.subn('\n\n  const getTotalsByCategory', tasks, count=1)
          if count != 1:
              raise RuntimeError(f'getStatusBadge removal matches={count}')

          tasks_path.write_text(tasks, encoding='utf-8')

      - name: Install dependencies
        run: npm --prefix frontend ci --ignore-scripts

      - name: Typecheck and build
        run: npm --prefix frontend run build:check
        env:
          VITE_API_URL: https://poolcalculator-production.up.railway.app/api
          VITE_BASE: /PoolCalculator/

      - name: Commit validated integration
        run: |
          git config user.name "jesus1942"
          git config user.email "chucky9425@gmail.com"
          git add frontend/src/components/ProjectTimeline.tsx frontend/src/components/TasksManager.tsx
          git commit -m "feat(progress): automatizar avance sin carga manual"
          git push origin HEAD:main
